on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths:
      - "pyproject.toml"
      - "requirements-min.txt"
      - ".github/workflows/install-and-test-min.yml"
      - ".github/workflows/test-reusable.yml"

jobs:
  tests-min:
    uses: ./.github/workflows/test-reusable.yml
    with:
      requirements_file: requirements-min.txt
      use_min_dep_versions: true
